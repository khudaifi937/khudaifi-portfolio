  <text x="236" y="182" fill="#91acaa" font-family="Arial,sans-serif" font-size="17" letter-spacing="4">A SELF-PACED LEARNING JOURNEY</text>
  <text x="236" y="232" fill="#e9f8f2" font-family="Arial,sans-serif" font-size="31" font-weight="700">Learn the fundamentals. Build with purpose.</text>
  <rect x="236" y="278" width="624" height="430" rx="20" fill="#142630" stroke="#d9fff3" stroke-opacity=".11"/>
  <text x="270" y="323" fill="#e0f2ed" font-family="Arial,sans-serif" font-size="20" font-weight="700">LEARNING PATH</text>
  <path d="M306 390v232" stroke="#46656b" stroke-width="4"/>
  <path d="M306 390v148" stroke="url(#learning-accent)" stroke-width="4"/>
  <circle cx="306" cy="390" r="13" fill="#72dfb7"/>
  <circle cx="306" cy="464" r="13" fill="#72dfb7"/>
  <circle cx="306" cy="538" r="13" fill="#5d9caa"/>
  <circle cx="306" cy="612" r="13" fill="#5d9caa"/>
  <g font-family="Arial,sans-serif">
    <text x="342" y="386" fill="#eaf6f3" font-size="18" font-weight="700">Programming fundamentals</text>
    <text x="342" y="411" fill="#8fa9a9" font-size="15">Logic, algorithms, and problem solving</text>
    <text x="342" y="460" fill="#eaf6f3" font-size="18" font-weight="700">Web foundations</text>
    <text x="342" y="485" fill="#8fa9a9" font-size="15">HTML, CSS, and JavaScript</text>
    <text x="342" y="534" fill="#eaf6f3" font-size="18" font-weight="700">Build and iterate</text>
    <text x="342" y="559" fill="#8fa9a9" font-size="15">Practice through small projects</text>
    <text x="342" y="608" fill="#eaf6f3" font-size="18" font-weight="700">First portfolio project</text>
    <text x="342" y="633" fill="#8fa9a9" font-size="15">Turn lessons into a working result</text>
  </g>
  <rect x="892" y="278" width="472" height="430" rx="20" fill="#172833" stroke="#d9fff3" stroke-opacity=".11"/>
  <rect x="924" y="310" width="408" height="228" rx="14" fill="#101b25"/>
  <path d="M924 352h408" stroke="#d9fff3" stroke-opacity=".1" stroke-width="2"/>
  <circle cx="948" cy="331" r="6" fill="#ff7c84"/>
  <circle cx="970" cy="331" r="6" fill="#ffc76c"/>
  <circle cx="992" cy="331" r="6" fill="#75d9b7"/>
  <text x="954" y="392" fill="#8da7a9" font-family="monospace" font-size="16">01</text>
  <text x="995" y="392" fill="#8cd9c0" font-family="monospace" font-size="17">&lt;main&gt;</text>
  <text x="954" y="430" fill="#8da7a9" font-family="monospace" font-size="16">02</text>
  <text x="1022" y="430" fill="#c9a7ff" font-family="monospace" font-size="17">  &lt;h1&gt;</text>
  <text x="1094" y="430" fill="#e5f3ed" font-family="monospace" font-size="17">Hello, web!&lt;/h1&gt;</text>
  <text x="954" y="468" fill="#8da7a9" font-family="monospace" font-size="16">03</text>
  <text x="995" y="468" fill="#8cd9c0" font-family="monospace" font-size="17">&lt;/main&gt;</text>
  <text x="954" y="506" fill="#8da7a9" font-family="monospace" font-size="16">04</text>
  <rect x="995" y="497" width="10" height="17" rx="2" fill="#75dfb7"/>
  <text x="924" y="582" fill="#91aaa9" font-family="Arial,sans-serif" font-size="15" letter-spacing="2">CORE BUILDING BLOCKS</text>
  <rect x="924" y="606" width="112" height="54" rx="12" fill="#293d4b"/>
  <text x="980" y="640" fill="#ffd28c" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">HTML</text>
  <rect x="1052" y="606" width="112" height="54" rx="12" fill="#293d4b"/>
  <text x="1108" y="640" fill="#8bc8ff" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">CSS</text>
  <rect x="1180" y="606" width="152" height="54" rx="12" fill="#293d4b"/>
  <text x="1256" y="640" fill="#f3dc79" font-family="Arial,sans-serif" font-size="17" font-weight="700" text-anchor="middle">JavaScript</text>
