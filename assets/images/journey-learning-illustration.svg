<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900">
  <title>Ilustrasi perjalanan belajar pengembangan web</title>
  <desc>Modul belajar, catatan kode, dan langkah-langkah membangun proyek pertama.</desc>
  <defs>
    <linearGradient id="learning-bg" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#102a2a"/>
      <stop offset=".55" stop-color="#1b3d42"/>
      <stop offset="1" stop-color="#26334a"/>
    </linearGradient>
    <linearGradient id="learning-accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#75e0b5"/>
      <stop offset="1" stop-color="#5abde9"/>
    </linearGradient>
    <pattern id="learning-grid" width="52" height="52" patternUnits="userSpaceOnUse">
      <path d="M52 0H0V52" fill="none" stroke="#c7fff0" stroke-opacity=".05"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#learning-bg)"/>
  <rect width="1600" height="900" fill="url(#learning-grid)"/>
  <circle cx="1330" cy="200" r="260" fill="#6de0bd" opacity=".09"/>
  <circle cx="180" cy="750" r="270" fill="#5f9df3" opacity=".1"/>
  <g transform="translate(0 67.5) scale(1 .85)">
